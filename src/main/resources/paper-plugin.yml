name: VCMCWelcome
version: '${project.version}'
main: jp.vcmc.welcome.WelcomePlugin
api-version: '26.3'
folia-supported: true
description: 'Welcome message plugin for Folia'

permissions:
  vcmc.welcome.admin:
    description: '/welcome で設定を変更する'
    default: op
  vcmcwelcome.admin:
    description: 'vcmc.welcome.admin の別名'
    default: op
    children:
      vcmc.welcome.admin: true
