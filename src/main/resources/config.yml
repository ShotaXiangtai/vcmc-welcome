# ===================================================
# VCMCWelcome 設定ファイル
# ===================================================
# 変更後は /welcome reload または /welcome set <キー> <値> で反映できます
# ===================================================

# 参加後にメッセージを表示するまでの遅延
# 20 ticks = 1秒
delay-ticks: 20

# 公式HP の URL (クリック可能なリンクとして表示されます)
url: "https://www.vcmc.jp/"

# サウンド設定
sound:
  # サウンド名 (Minecraftのサウンドキー)
  name: "entity.player.levelup"
  volume: 1.0
  pitch: 1.0

# ===================================================
# メッセージ設定
# MiniMessage 形式で記述します
# 参考: https://docs.advntr.dev/minimessage/format.html
#
# 使用できる色タグ例:
#   <red>, <green>, <blue>, <yellow>, <aqua>, <gold>,
#   <white>, <gray>, <dark_gray>, <dark_red> など
#
# 装飾タグ例:
#   <bold>, <italic>, <underlined>, <strikethrough>
#   <st>...</st> (取り消し線), <u>...</u> (下線)
#
# プレースホルダー:
#   <player> ... プレイヤー名 (MiniMessage タグ形式)
# ===================================================
messages:
  # 区切り線
  separator: "<dark_gray><st>--------------------------------------------</st>"

  # ウェルカムメッセージ (<player> がプレイヤー名に置き換わります)
  welcome: "<yellow><bold>ようこそ！ <aqua><player></aqua><white> さん"

  # 公式HP のラベル
  url-label: "<green><bold>[公式HP] <white>クリックしてアクセス:"

  # URL にカーソルを乗せたときに表示されるテキスト (MiniMessage 形式可)
  url-hover: "クリックしてHPを開く"

  # Discord 案内メッセージ
  discord-warning: "<red><bold>【重要】 <gold>Discordサーバーへの参加は <dark_red><u>必須</u></dark_red><gold> です！"
  discord-note: "<gray>※HP内に招待リンクがあります"
