name: vcmc-welcome
version: ${project.version}
main: jp.vcmc.welcome.WelcomePlugin
api-version: "26.1"
folia-supported: true
description: VCMC ウェルカムメッセージプラグイン
authors:
  - VCMC

commands:
  welcome:
    description: VCMCWelcome プラグインコマンド
    permission: vcmcwelcome.admin
    usage: /welcome [reload|set <キー> <値>|get <キー>]

permissions:
  vcmcwelcome.admin:
    description: 管理者コマンドを使用できる権限
    default: op
